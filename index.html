<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FExpense">
<title>FExpense</title>
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ===== PART 1: STYLE (minimalist: black, white, thin lines) ===== */
:root{color-scheme:dark;--bg:#000;--tx:#ececec;--mut:#7a7a7a;--line:#1e1e1e;--good:#8fcfa9;--bad:#e58b8b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:300 15px/1.5 -apple-system,system-ui,sans-serif;padding-bottom:84px;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto;padding:18px 20px 0}
header img{height:30px;width:auto}
header span{letter-spacing:.35em;font-size:13px;font-weight:500}
#app{max-width:520px;margin:0 auto;padding:8px 20px}
h1{font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin:26px 0 6px}
small,.mut{color:var(--mut);font-size:12px;display:block;letter-spacing:.02em}
b{font-weight:500}
.card{border-top:1px solid var(--line);padding:20px 0}
.row{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.row b{display:block;font-size:22px;font-weight:300}
.row2{display:flex;gap:10px;margin-top:14px}
.g{color:var(--good)}.r{color:var(--bad)}
input,select,button{font:inherit;font-weight:400;color:var(--tx);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;min-width:0;outline:0}
input,select{width:100%;margin-top:6px}
input:focus,select:focus{border-bottom-color:#fff}
input[type=date]{color-scheme:dark}
.row2 input{margin-top:0}
button{background:#fff;color:#000;border:0;border-radius:8px;padding:12px 20px;font-size:13px;font-weight:500;letter-spacing:.06em;cursor:pointer}
button.ghost,.x{background:transparent;color:var(--mut);padding:6px 10px;font-size:14px}
button.red{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:#fff}
.bar i.over{background:var(--bad)}
.seg{display:flex;gap:24px;margin-bottom:6px}
.seg button,.chips button{background:transparent;color:var(--mut);padding:6px 0;border-radius:0;border-bottom:1px solid transparent;letter-spacing:.02em;font-weight:400}
.seg button.on,.chips button.on{color:#fff;border-bottom-color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.item div,.grow{flex:1;min-width:0}
.item b{font-weight:400}
.chk{width:30px;height:30px;border-radius:50%;background:transparent;border:1px solid #444;padding:0;color:#000}
.chk.on{background:#fff;border-color:#fff}
.chips{display:flex;gap:20px;overflow-x:auto;margin:8px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;text-align:center}
.cal em{font-style:normal;color:var(--mut);font-size:11px}
.day{padding:9px 0;border-radius:50%;font-size:13px;color:var(--mut)}
.day.on{background:#fff;color:#000;font-weight:500}
.day.today{outline:1px solid #666}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.cols i{display:block;width:40%;margin:0 auto 6px;background:#fff;border-radius:2px 2px 0 0;min-height:2px}
.bdg{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid #444;color:#ddd;font-weight:500;font-size:9px;flex:none}
.bdg.big{width:44px;height:44px;font-size:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(0,0,0,.92);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:16px 0 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:400}
nav button.on{color:#fff}
nav{align-items:center}
nav button[data-t=accounts],nav button[data-t=charts]{flex:1.5}
nav button[data-t=home]{flex:1.8;margin:8px 4px;padding:14px 0;font-size:15px;font-weight:600;letter-spacing:.14em;color:#fff;border:1px solid #fff;border-radius:14px}
nav button[data-t=home].on{background:#fff;color:#000}
.imp{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.step{width:34px;height:34px;border-radius:50%;background:transparent;border:1px solid #444;color:#fff;padding:0;font-size:18px;line-height:1}
</style>
</head>

<script>
// ===== PART 2: SETTINGS + SAVED DATA =====
var CUR = "₱";                                   // change to your currency symbol
var EX = ["Food","Bills","Transport","Shopping","Fun","Health","Other"];   // expense categories
var IN = ["Salary","Gift","Side income","Other"];                          // income categories
var tab = "home", type = "expense", hSel = null, cal = new Date();

function load(){                                  // read saved data from the phone
  var d = null;
  try { d = JSON.parse(localStorage.getItem("fexpense")); } catch(e){}
  if (!d || !d.tx) d = { tx: [], budget: 0, habits: [] };
  if (!d.accts) d.accts = [   // your accounts: s = badge text, c = badge color
    { id: "rcbc", name: "RCBC", s: "RCBC", c: "#005bac", open: 0 },
    { id: "gcash", name: "GCash", s: "GCash", c: "#007dfe", open: 0 },
    { id: "bpi", name: "BPI", s: "BPI", c: "#b0121b", open: 0 },
    { id: "unionbank", name: "UnionBank", s: "UB", c: "#f26b21", open: 0 }
  ];
  if (!d.unpaid) d.unpaid = [];
  if (!d.accts.some(function(a){ return a.id === "applepay"; })) d.accts.push({ id: "applepay", name: "Apple Pay", s: "Pay", c: "#ffffff", open: 0 });
  if (!d.hc) d.hc = {};
  if (!d.foods) d.foods = [];
  if (!d.weights) d.weights = [{ id: 1, date: ds(new Date()), kg: 86 }];
  d.tx.forEach(function(t){ if (!t.acct && t.type !== "transfer") t.acct = d.accts[0].id; });
  return d;
}
function save(){ try { localStorage.setItem("fexpense", JSON.stringify(S)); } catch(e){} }
var S = load();                                   // S = all your app data

// ===== PART 3: SMALL HELPER FUNCTIONS =====
function el(id){ return document.getElementById(id); }
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function ds(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function money(n){ return CUR + n.toFixed(2); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function monthTx(){ var m = ds(new Date()).slice(0,7); return S.tx.filter(function(t){ return t.date.slice(0,7) === m; }); }
function sum(a, ty){ return a.filter(function(t){ return t.type === ty; }).reduce(function(s,t){ return s + t.amt; }, 0); }

// ===== PART 4: ACTIONS (what buttons do) =====
function setTab(t){ tab = t; window.scrollTo(0,0); render(); }
function setType(t){ type = t; render(); }
function add(){
  var a = parseFloat(el("amt").value);
  if (!(a > 0)) { alert("Enter an amount"); return; }
  S.tx.push({ id: Date.now(), type: type, amt: a, acct: el("acc").value, cat: el("cat").value, note: el("note").value.trim(), date: el("dt").value || ds(new Date()) });
  save(); render();
}
function addIncome(){
  var a = parseFloat(el("iamt").value);
  if (!(a > 0)) { alert("Enter an amount"); return; }
  S.tx.push({ id: Date.now(), type: "income", amt: a, cat: "Salary", acct: el("iacc").value, note: el("inote").value.trim(), date: el("idt").value || ds(new Date()) });
  save(); render();
}
// account helpers
function acct(id){ return S.accts.find(function(a){ return a.id === id; }) || S.accts[0]; }
function an(id){ return acct(id).name; }
function badge(id, big){ var a = acct(id); return '<span class="bdg' + (big ? ' big' : '') + '" style="border-color:' + a.c + '">' + a.s + '</span>'; }
function bal(id){
  var b = acct(id).open || 0;
  S.tx.forEach(function(t){
    if (t.type === "transfer") { if (t.from === id) b -= t.amt; if (t.to === id) b += t.amt; }
    else if (t.acct === id) b += t.type === "expense" ? -t.amt : t.amt;
  });
  return b;
}
function accOpts(sel){ return S.accts.map(function(a){ return '<option value="' + a.id + '"' + (a.id === sel ? ' selected' : '') + '>' + a.name + '</option>'; }).join(""); }
function adjust(sign){
  var a = parseFloat(el("aamt").value);
  if (!(a > 0)) { alert("Enter an amount"); return; }
  S.tx.push({ id: Date.now(), type: "adj", amt: a * sign, acct: el("aacc").value, note: el("anote").value.trim(), date: ds(new Date()) });
  save(); render();
}
function transfer(){
  var a = parseFloat(el("tamt").value), f = el("tfrom").value, t = el("tto").value;
  if (!(a > 0) || f === t) { alert("Enter an amount and pick two different accounts"); return; }
  S.tx.push({ id: Date.now(), type: "transfer", amt: a, from: f, to: t, note: "", date: ds(new Date()) });
  save(); render();
}
var hf = "all";
function setHf(v){ hf = v; render(); }
function del(id){ var d0 = S.tx.find(function(t){ return t.id === id; }); if (d0 && d0.uid) S.unpaid.forEach(function(u){ if (u.id === d0.uid) { u.paid = false; u.paidOn = ""; } }); S.tx = S.tx.filter(function(t){ return t.id !== id; }); save(); render(); }
var HB = [["pickle","Pickleball"],["basket","Basketball"],["jog","Jog"],["gym","Gym"]];
function cnt(k, d){ return (S.hc[k] && S.hc[k][d]) || 0; }
function bump(k, n){                          // + / - on today's counter
  var d = ds(new Date()), c = Math.max(0, cnt(k, d) + n);
  S.hc[k] = S.hc[k] || {};
  if (c) S.hc[k][d] = c; else delete S.hc[k][d];
  save(); render();
}
function lb(kg){ return (kg * 2.20462).toFixed(1); }   // kg to pounds
function addW(){
  var kg = parseFloat(el("wkg").value);
  if (!(kg > 0)) { alert("Enter your weight in kg"); return; }
  S.weights.push({ id: Date.now(), date: ds(new Date()), kg: kg }); save(); render();
}
function delW(id){ if (S.weights.length > 1) { S.weights = S.weights.filter(function(w){ return w.id !== id; }); save(); render(); } }
function addF(){
  var n = el("fname").value.trim(); if (!n) return;
  S.foods.push({ id: Date.now(), name: n, date: ds(new Date()) }); save(); render();
}
function delF(id){ S.foods = S.foods.filter(function(f){ return f.id !== id; }); save(); render(); }
function pick(k){ hSel = k; render(); }
function shiftCal(n){ cal = new Date(cal.getFullYear(), cal.getMonth() + n, 1); render(); }

// ===== PART 5: SCREENS (builds the HTML for each tab) =====
function txRow(t){
  var tr = t.type === "transfer", adj = t.type === "adj", inc = t.type === "income";
  var pos = inc || (adj && t.amt > 0), amt = Math.abs(t.amt);
  var title = tr ? an(t.from) + " → " + an(t.to) : adj ? (t.amt > 0 ? "Added money" : "Deducted money") : (t.note || t.cat);
  var sub = (tr ? "Transfer" : an(t.acct)) + (t.note && (tr || adj) ? " · " + esc(t.note) : "") + (inc || t.type === "expense" ? " · " + t.cat : "") + " · " + t.date;
  return '<div class="item">' + (tr ? '<span class="bdg" style="background:#555">⇄</span>' : badge(t.acct)) + '<div><b>' + esc(title) + '</b><small>' + sub + '</small></div>' +
    '<span class="' + (tr ? "" : pos ? "g" : "r") + '">' + (tr ? "" : pos ? "+" : "-") + money(amt) + '</span>' +
    '<button class="x" onclick="del(' + t.id + ')">✕</button></div>';
}

function impBtn(){
  return '<div style="text-align:right;margin-top:6px"><label class="imp">Import Apple Pay<input id="impf" type="file" accept=".txt,text/plain" onchange="importAP(this)" hidden></label></div>';
}
function importAP(inp){   // reads the shortcut's text file; each payment line looks like  FX|date time|amount|merchant
  var f = inp.files && inp.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    var segs = String(r.result).split("FX|").slice(1), added = 0, skipped = 0;
    segs.forEach(function(sg, i){
      var p = sg.trim().split("|"), ts = (p[0] || "").trim();
      var a = Math.abs(parseFloat((p[1] || "").replace(/[^0-9.\-]/g, ""))), m = p.slice(2).join("|").trim();
      if (!/^\d{4}-\d{2}-\d{2}/.test(ts) || !(a > 0)) return;           // skips blank / zero payments
      var ref = ts + "|" + a + "|" + m;
      if (S.tx.some(function(t){ return t.ref === ref; })) { skipped++; return; }   // already imported
      S.tx.push({ id: Date.now() + i, type: "expense", amt: a, acct: "applepay", cat: "Other", note: m || "Apple Pay", date: ts.slice(0, 10), ref: ref, src: "file" });
      added++;
    });
    inp.value = ""; save(); render();
    alert(added + " new Apple Pay payment(s) imported" + (skipped ? " (" + skipped + " already added)" : ""));
  };
  r.readAsText(f);
}
function backupCard(){
  return '<div class="card"><b>Backup</b><small>Last backup: ' + (S.lastBackup || "never") + '</small>' +
  '<div class="row2"><button style="flex:1" onclick="backup()">Save backup</button>' +
  '<label class="imp" style="flex:1;text-align:center;padding:12px 0">Restore<input type="file" accept=".json,application/json,text/plain" onchange="restore(this)" hidden></label></div></div>';
}
function backup(){   // saves ALL your data to a file you can keep in Files / iCloud
  S.lastBackup = ds(new Date()); save();
  var name = "FExpense-backup-" + S.lastBackup + ".json", text = JSON.stringify(S, null, 1);
  var file = new File([text], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(function(){});   // opens the share sheet: choose Save to Files
  } else {
    var a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  render();
}
function restore(inp){   // loads a backup file and replaces the current data
  var f = inp.files && inp.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.tx)) throw 0;
      if (!confirm("Replace all current data with this backup?")) { inp.value = ""; return; }
      localStorage.setItem("fexpense", JSON.stringify(d)); S = load(); save(); render();
      alert("Backup restored");
    } catch(e){ alert("That file isn't a valid FExpense backup"); }
    inp.value = "";
  };
  r.readAsText(f);
}
var fsub = "over";
function setF(v){ fsub = v; render(); }
function addU(){
  var n = el("uname").value.trim(), a = parseFloat(el("uamt").value);
  if (!n || !(a > 0)) { alert("Enter a name and amount"); return; }
  S.unpaid.push({ id: Date.now(), name: n, amt: a, acct: el("uacc").value, date: el("udt").value || ds(new Date()), paid: false, paidOn: "" });
  save(); render();
}
function pay(id){   // pays the bill: deducts from the chosen bank/e-wallet and logs it
  var u = S.unpaid.find(function(x){ return x.id === id; }); if (!u) return;
  var b = bal(u.acct);
  if (b < u.amt && !confirm(an(u.acct) + " balance is " + money(b) + ". Pay anyway?")) return;
  var t = ds(new Date());
  S.tx.push({ id: Date.now(), type: "expense", amt: u.amt, acct: u.acct, cat: "Bills", note: u.name, date: t, uid: id });
  u.paid = true; u.paidOn = t; save(); render();
}
function delU(id){ S.unpaid = S.unpaid.filter(function(u){ return u.id !== id; }); save(); render(); }
function unpaidView(){
  var open = S.unpaid.filter(function(u){ return !u.paid; }).sort(function(a, b){ return a.date.localeCompare(b.date); });
  var done = S.unpaid.filter(function(u){ return u.paid; }).sort(function(a, b){ return b.paidOn.localeCompare(a.paidOn); });
  var tot = open.reduce(function(s, u){ return s + u.amt; }, 0);
  function row(u){
    return '<div class="item">' + badge(u.acct) + '<div><b>' + esc(u.name) + '</b><small>' + money(u.amt) + '</small><small>' + (u.paid ? 'Paid ' + u.paidOn : 'Due ' + u.date) + '</small></div>' +
      (u.paid ? '' : '<button onclick="pay(' + u.id + ')">Pay</button>') + '<button class="x" onclick="delU(' + u.id + ')">✕</button></div>';
  }
  return '<div class="card" style="border:0"><small>Total unpaid</small><b style="font-size:28px;font-weight:300">' + money(tot) + '</b></div>' +
  '<div class="card"><b>Add unpaid</b><input id="uname" placeholder="Name (e.g. Internet bill)"><input id="uamt" type="number" inputmode="decimal" placeholder="Amount">' +
  '<small style="margin-top:12px">Pay from</small><select id="uacc">' + accOpts() + '</select>' +
  '<small style="margin-top:12px">Pay date</small><input id="udt" type="date" value="' + ds(new Date()) + '">' +
  '<div class="row2"><button style="width:100%" onclick="addU()">Add</button></div></div>' +
  '<div class="card"><b>To pay</b>' + (open.map(row).join("") || '<small>Nothing unpaid.</small>') + '</div>' +
  (done.length ? '<div class="card"><b>Paid</b>' + done.map(row).join("") + '</div>' : '');
}
function home(){
  var n = S.unpaid.filter(function(u){ return !u.paid; }).length;
  return '<h1>Fuck</h1><div class="seg"><button class="' + (fsub === "over" ? "on" : "") + '" onclick="setF(\'over\')">Overview</button>' +
    '<button class="' + (fsub === "unpaid" ? "on" : "") + '" onclick="setF(\'unpaid\')">Unpaid' + (n ? ' (' + n + ')' : '') + '</button></div>' +
    (fsub === "unpaid" ? unpaidView() : impBtn() + homeMain());
}
function homeMain(){
  var m = monthTx(), inc = sum(m,"income"), exp = sum(m,"expense");
  var cats = type === "expense" ? EX : IN;
  var list = m.slice().sort(function(a,b){ return b.date.localeCompare(a.date) || b.id - a.id; }).map(txRow).join("");
  return '<div class="card" style="border:0"><div class="row"><div><small>Income</small><b class="g">' + money(inc) + '</b></div>' +
  '<div><small>Spent</small><b class="r">' + money(exp) + '</b></div><div><small>Balance</small><b>' + money(inc - exp) + '</b></div></div>' +
  '</div>' +
  '<div class="card"><div class="seg"><button class="' + (type === "expense" ? "on" : "") + '" onclick="setType(\'expense\')">Expense</button>' +
  '<button class="' + (type === "income" ? "on" : "") + '" onclick="setType(\'income\')">Income</button></div>' +
  '<input id="amt" type="number" inputmode="decimal" placeholder="Amount">' +
  '<select id="acc">' + accOpts() + '</select>' +
  '<select id="cat">' + cats.map(function(c){ return '<option>' + c + '</option>'; }).join("") + '</select>' +
  '<input id="note" placeholder="Note (optional)"><input id="dt" type="date" value="' + ds(new Date()) + '">' +
  '<div class="row2"><button style="width:100%" onclick="add()">Add ' + type + '</button></div></div>' +
  '<div class="card"><b>This month</b>' + (list || '<small>Nothing yet. Add your first entry above.</small>') + '</div>';
}

function daily(){
  var inc = monthTx().filter(function(t){ return t.type === "income"; }), days = {};
  inc.forEach(function(t){ (days[t.date] = days[t.date] || []).push(t); });
  var keys = Object.keys(days).sort().reverse(), total = sum(inc,"income");
  var rows = keys.map(function(k){
    var dayTotal = days[k].reduce(function(s,t){ return s + t.amt; }, 0);
    return '<div class="card"><div class="row" style="margin:0"><b>' + k + '</b><b class="g">+' + money(dayTotal) + '</b></div>' + days[k].map(txRow).join("") + '</div>';
  }).join("");
  return '<h1>Daily income</h1>' +
  '<div class="card"><div class="row"><div><small>This month</small><b class="g">' + money(total) + '</b></div>' +
  '<div><small>Days earned</small><b>' + keys.length + '</b></div>' +
  '<div><small>Avg / day</small><b>' + money(keys.length ? total / keys.length : 0) + '</b></div></div>' +
  '<input id="idt" type="date" value="' + ds(new Date()) + '"><input id="iamt" type="number" inputmode="decimal" placeholder="Amount earned">' +
  '<select id="iacc">' + accOpts() + '</select><input id="inote" placeholder="Source (optional)"><div class="row2"><button style="width:100%" onclick="addIncome()">Add income</button></div></div>' +
  (rows || '<p class="mut">No income logged this month.</p>');
}

function habits(){
  var t = ds(new Date()), mo0 = t.slice(0,7);
  var h = '<h1>Habits</h1><div class="card" style="border:0"><b>Today</b>' + HB.map(function(x){
    var k = x[0], mc = 0;
    Object.keys(S.hc[k] || {}).forEach(function(d){ if (d.slice(0,7) === mo0) mc += S.hc[k][d]; });
    return '<div class="item"><div><b>' + x[1] + '</b><small>' + mc + ' this month</small></div>' +
      '<button class="step" onclick="bump(\'' + k + '\',-1)">\u2212</button><b style="min-width:24px;text-align:center">' + cnt(k, t) + '</b>' +
      '<button class="step" onclick="bump(\'' + k + '\',1)">+</button></div>';
  }).join("") + '</div>';
  var ws = S.weights.slice().sort(function(a, b){ return a.date.localeCompare(b.date) || a.id - b.id; }), cur = ws[ws.length - 1];
  h += '<div class="card"><b>Weight</b><div class="row" style="margin:12px 0 0"><div><b>' + cur.kg + ' kg</b><small>' + cur.date + '</small></div>' +
    '<div><b>' + lb(cur.kg) + ' lb</b><small>pounds</small></div></div>' +
    '<div class="row2"><input id="wkg" type="number" inputmode="decimal" placeholder="New weight (kg)"><button onclick="addW()">Log</button></div>' +
    ws.slice(-4, -1).reverse().map(function(w){
      return '<div class="item"><div><b>' + w.kg + ' kg</b><small>' + w.date + '</small></div><small>' + lb(w.kg) + ' lb</small><button class="x" onclick="delW(' + w.id + ')">\u2715</button></div>';
    }).join("") + '</div>';
  h += '<div class="card"><b>Food I tried</b><small>' + S.foods.length + ' total</small>' +
    '<div class="row2"><input id="fname" placeholder="Latest food you tried"><button onclick="addF()">Add</button></div>' +
    S.foods.slice().reverse().slice(0, 6).map(function(f){
      return '<div class="item"><div><b>' + esc(f.name) + '</b><small>' + f.date + '</small></div><button class="x" onclick="delF(' + f.id + ')">\u2715</button></div>';
    }).join("") + '</div>';
  if (typeof hSel !== "string") hSel = "pickle";
  var y = cal.getFullYear(), mo = cal.getMonth(), first = new Date(y, mo, 1).getDay(), n = new Date(y, mo + 1, 0).getDate();
  var cells = "", count = 0, i, d;
  ["S","M","T","W","T","F","S"].forEach(function(w){ cells += '<em>' + w + '</em>'; });
  for (i = 0; i < first; i++) cells += '<span></span>';
  for (d = 1; d <= n; d++) {
    var k = y + "-" + pad(mo + 1) + "-" + pad(d), on = cnt(hSel, k) > 0;
    if (on) count++;
    cells += '<span class="day ' + (on ? "on" : "") + (k === t ? " today" : "") + '">' + d + '</span>';
  }
  var name = cal.toLocaleString("default", { month: "long", year: "numeric" });
  return h + '<div class="card"><b>History</b><div class="chips">' + HB.map(function(x){
    return '<button class="' + (x[0] === hSel ? "on" : "") + '" onclick="pick(\'' + x[0] + '\')">' + x[1] + '</button>';
  }).join("") + '</div><div class="row" style="align-items:center;margin:0"><button class="ghost" onclick="shiftCal(-1)">\u25c0</button>' +
  '<div style="text-align:center"><b style="font-size:16px">' + name + '</b><small>' + count + ' / ' + n + ' days</small></div>' +
  '<button class="ghost" onclick="shiftCal(1)">\u25b6</button></div><div class="cal">' + cells + '</div></div>';
}

function accounts(){
  var total = S.accts.reduce(function(s, a){ return s + bal(a.id); }, 0);
  return '<h1>Accounts</h1><div class="card"><small>Total across all accounts</small><b style="font-size:28px">' + money(total) + '</b></div>' +
  S.accts.map(function(a){
    var b = bal(a.id);
    return '<div class="card"><div class="item" style="border:0;padding:0">' + badge(a.id, 1) + '<div><b>' + a.name + '</b></div><b class="' + (b < 0 ? "r" : "") + '">' + money(b) + '</b></div></div>';
  }).join("") +
  '<div class="card"><b>Add or deduct money</b><select id="aacc">' + accOpts() + '</select>' +
  '<input id="aamt" type="number" inputmode="decimal" placeholder="Amount"><input id="anote" placeholder="Note (optional)">' +
  '<div class="row2"><button style="flex:1" onclick="adjust(1)">+ Add</button><button class="red" style="flex:1" onclick="adjust(-1)">− Deduct</button></div></div>' +
  '<div class="card"><b>Transfer between accounts</b><select id="tfrom">' + accOpts() + '</select><select id="tto">' + accOpts(S.accts[1].id) + '</select>' +
  '<input id="tamt" type="number" inputmode="decimal" placeholder="Amount"><div class="row2"><button style="width:100%" onclick="transfer()">Transfer</button></div></div>' + backupCard();
}

function historyScreen(){
  var list = S.tx.filter(function(t){ return hf === "all" || t.acct === hf || t.from === hf || t.to === hf; })
    .sort(function(a, b){ return b.date.localeCompare(a.date) || b.id - a.id; });
  var chips = '<button class="' + (hf === "all" ? "on" : "") + '" onclick="setHf(\'all\')">All</button>' + S.accts.map(function(a){
    return '<button class="' + (hf === a.id ? "on" : "") + '" onclick="setHf(\'' + a.id + '\')">' + a.name + '</button>';
  }).join("");
  return '<h1>History</h1><div class="chips">' + chips + '</div><div class="card">' + (list.map(txRow).join("") || '<small>No transactions yet.</small>') + '</div>';
}

function charts(){
  var m = monthTx(), exp = m.filter(function(t){ return t.type === "expense"; }), by = {}, max = 1;
  exp.forEach(function(t){ by[t.cat] = (by[t.cat] || 0) + t.amt; });
  var cats = Object.keys(by).sort(function(a,b){ return by[b] - by[a]; });
  if (cats.length) max = by[cats[0]];
  var catHtml = cats.map(function(c){
    return '<div style="margin-top:10px"><div class="row" style="margin:0"><span>' + c + '</span><span>' + money(by[c]) + '</span></div>' +
      '<div class="bar"><i style="width:' + (by[c] / max * 100) + '%"></i></div></div>';
  }).join("") || '<small>No expenses this month.</small>';
  var week = [], mx = 1, i;                       // last 7 days of spending
  for (i = 6; i >= 0; i--) {
    var dt = new Date(); dt.setDate(dt.getDate() - i);
    var k = ds(dt), v = sum(S.tx.filter(function(t){ return t.date === k; }), "expense");
    week.push({ l: dt.toLocaleString("default", { weekday: "short" }), v: v }); if (v > mx) mx = v;
  }
  var inc = sum(m,"income"), sp = sum(m,"expense"), top = Math.max(inc, sp, 1);
  return '<h1>Charts</h1>' +
  '<div class="card"><b>Income vs spent</b><div style="margin-top:10px"><small>Income ' + money(inc) + '</small><div class="bar"><i style="width:' + (inc / top * 100) + '%;background:var(--good)"></i></div>' +
  '<small>Spent ' + money(sp) + '</small><div class="bar"><i class="over" style="width:' + (sp / top * 100) + '%"></i></div></div></div>' +
  '<div class="card"><b>Spending by category</b>' + catHtml + '</div>' +
  '<div class="card"><b>Last 7 days</b><div class="cols">' + week.map(function(w){
    return '<div><i style="height:' + (w.v / mx * 90) + 'px"></i>' + w.l + '</div>';
  }).join("") + '</div></div>';
}

// ===== PART 6: DRAW THE SCREEN =====
function render(){
  var screens = { home: home, accounts: accounts, history: historyScreen, daily: daily, habits: habits, charts: charts };
  el("app").innerHTML = screens[tab]();
  document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.t === tab); });
}
// ===== PART 7: ADD FROM A LINK (used by the Apple Pay shortcut) =====
(function(){
  try {
    var q = new URLSearchParams(location.search), a = parseFloat(q.get("amt"));
    if (a > 0) {                                   // ignores blank / zero payments
      var note = (q.get("note") || "").trim() || "Apple Pay", id = acct(q.get("acct") || "applepay").id;
      var dup = S.tx.some(function(t){ return t.src === "url" && t.amt === a && t.note === note && Date.now() - t.id < 60000; });
      if (!dup) {                                  // skips a double-fire within 60 seconds
        S.tx.push({ id: Date.now(), type: "expense", amt: a, acct: id, cat: EX.indexOf(q.get("cat")) >= 0 ? q.get("cat") : "Other", note: note, date: ds(new Date()), src: "url" });
        save();
      }
    }
    if (location.search) history.replaceState(null, "", location.pathname);   // clears the link so a refresh can't add it twice
  } catch(e){}
})();
render();
</script>
